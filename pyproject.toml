[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "camelmailer"
dynamic = ["version"]
description = "Python SDK for Camelmailer — open-source transactional email"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Camelmailer contributors" }]
keywords = ["email", "transactional", "camelmailer", "smtp", "api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.23.0"]

[project.urls]
Homepage = "https://camelmailer.com"
Documentation = "https://camelmailer.com/docs"
Repository = "https://github.com/camelmailer/camelmailer-python"
Changelog = "https://github.com/camelmailer/camelmailer-python/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/camelmailer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/camelmailer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]

[tool.ruff.lint.per-file-ignores]
# TypedDict annotations are introspectable at runtime; keep them
# evaluable on Python 3.9 (no `X | None` syntax).
"src/camelmailer/types.py" = ["UP007", "UP045"]

[tool.mypy]
strict = true
files = ["src"]
